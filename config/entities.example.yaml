# Optional aliases and favorites. These entries never restrict read access.
rooms:
  example_office:
    temperature: sensor.example_office_temperature
    presence: binary_sensor.example_office_presence

climate:
  example_outdoor:
    temperature: sensor.example_outdoor_temperature
    humidity: sensor.example_outdoor_humidity
    battery: sensor.example_outdoor_sensor_battery

batteries:
  example_outdoor_sensor: sensor.example_outdoor_sensor_battery

lights: {}
displays: {}
scenes: {}
infra: {}
ups: {}

# Retained for compatibility and favorites only. General state and history
# tools dynamically accept every valid Home Assistant entity ID.
allowed_raw_entities:
  - sensor.example_office_temperature
  - binary_sensor.example_office_presence
  - sensor.example_outdoor_temperature
  - sensor.example_outdoor_humidity
  - sensor.example_outdoor_sensor_battery

# Proposal generation is read-only and disabled unless explicitly configured.
editable_automations: []

recent_changes:
  numeric_delta_default: 0
  debounce_seconds: 0
  max_results: 200
  numeric_delta_by_entity: {}
  numeric_delta_by_unit:
    "°C": 0.3
    "%": 1.0
  unordered_entities: []
