[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "nara-home-mcp"
version = "0.4.6"
description = "Read-only MCP server for Home Assistant operational data"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Nara Home contributors" }]
dependencies = [
  "mcp>=1.27,<2",
  "httpx>=0.27,<1",
  "websockets>=16.1,<17",
  "pydantic>=2.7,<3",
  "pydantic-settings>=2.3,<3",
  "PyYAML>=6.0,<7",
  "tenacity>=8.3,<9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2,<9",
  "pytest-asyncio>=0.23,<1",
]

[project.scripts]
nara-home-mcp = "app.main:main"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
